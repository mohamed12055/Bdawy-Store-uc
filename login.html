<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تسجيل الدخول | BDAWY STORE</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div id="background"></div>


<header class="top-header">

    <div class="logo">
        BDAWY <span>STORE</span>
    </div>

    <a
        href="index.html"
        class="secondary-btn"
    >
        🏠 الرئيسية
    </a>

</header>


<main class="auth-page login-page">

    <div class="auth-card">

        <div class="auth-logo">
            BDAWY <span>STORE</span>
        </div>


        <div class="auth-icon">
            🔐
        </div>


        <h1>
            أهلاً بيك 👋
        </h1>


        <p class="auth-subtitle">
            سجل دخولك عشان تقدر تطلب شحن الألعاب
        </p>


        <form id="loginForm">


            <div class="input-group">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    كلمة المرور
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="اكتب كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="auth-submit"
                id="loginBtn"
            >
                🔐 تسجيل الدخول
            </button>


            <div
                id="loginMessage"
                class="form-message"
            ></div>


        </form>


        <div class="auth-divider">
            أو
        </div>


        <p class="register-text">

            مش عندك حساب؟

            <a href="register.html">
                إنشاء حساب جديد
            </a>

        </p>


        <a
            href="index.html"
            class="back-home"
        >
            ← الرجوع للصفحة الرئيسية
        </a>


    </div>

</main>



<script
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js">
</script>

<script
    src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js">
</script>


<script>

VANTA.NET({

    el: "#background",

    mouseControls: true,

    touchControls: true,

    gyroControls: false,

    minHeight: 200,

    minWidth: 200,

    scale: 1,

    scaleMobile: 1,

    color: 0xff0000,

    backgroundColor: 0x030303,

    points: 12,

    maxDistance: 22,

    spacing: 18

});

</script>

<script type="module">

import { auth, db } from "./firebase.js";


import {

    signInWithEmailAndPassword

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

    doc,
    getDoc

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const form =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const message =
    document.getElementById(
        "loginMessage"
    );


const togglePassword =
    document.getElementById(
        "togglePassword"
    );


/* إظهار وإخفاء كلمة المرور */

togglePassword.addEventListener(
    "click",
    () => {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            togglePassword.textContent =
                "🙈";

        } else {

            passwordInput.type =
                "password";

            togglePassword.textContent =
                "👁️";

        }

    }
);


/* تسجيل الدخول */

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "❌ اكتب البريد الإلكتروني وكلمة المرور.",
                "error"
            );

            return;

        }


        loginBtn.disabled =
            true;


        loginBtn.textContent =
            "⏳ جاري تسجيل الدخول...";


        try {

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                result.user;


            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                !userSnap.exists()
            ) {

                showMessage(
                    "❌ بيانات الحساب غير موجودة.",
                    "error"
                );


                return;

            }


            const userData =
                userSnap.data();


            showMessage(
                "✅ تم تسجيل الدخول بنجاح...",
                "success"
            );


            setTimeout(
                () => {

                    if (
                        userData.role ===
                        "admin"
                    ) {

                        window.location.href =
                            "admin.html";

                    } else {

                        window.location.href =
                            "store.html";

                    }

                },
                700
            );


        } catch (error) {

            console.error(error);


            let text =
                "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";


            if (
                error.code ===
                "auth/invalid-email"
            ) {

                text =
                    "❌ البريد الإلكتروني غير صحيح.";

            }


            if (
                error.code ===
                "auth/user-disabled"
            ) {

                text =
                    "❌ هذا الحساب تم تعطيله.";

            }


            showMessage(
                text,
                "error"
            );

        }


        loginBtn.disabled =
            false;


        loginBtn.textContent =
            "🔐 تسجيل الدخول";

    }
);


/* الرسائل */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "form-message " +
        type;

}

</script>

<audio id="siteAudio" src="site-audio.mp3.mp3" autoplay loop preload="auto" aria-hidden="true"></audio>
<script>
    (() => {
        const audio = document.getElementById("siteAudio");
        const startAudio = () => {
            audio.play().then(() => {
                ["pointerdown", "keydown", "touchstart"].forEach((eventName) => {
                    document.removeEventListener(eventName, startAudio);
                });
            }).catch(() => {});
        };

        startAudio();
        ["pointerdown", "keydown", "touchstart"].forEach((eventName) => {
            document.addEventListener(eventName, startAudio, { once: true, passive: true });
        });
    })();
</script>
</body>

</html>
